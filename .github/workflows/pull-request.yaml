name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Format
        run: go run ./cmd/scripts fmt

      - name: Vet
        run: go run ./cmd/scripts vet

      - name: Build
        run: go run ./cmd/scripts build

      - name: Test
        run: go run ./cmd/scripts test
